<polyline points="490,692 620,692" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-change-loops)"/>
<polyline points="955,692 1065,692" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-change-loops)"/>
<polyline points="1425,692 1490,692" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-change-loops)"/>
