<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1190" viewBox="0 0 1500 1190" role="img" aria-labelledby="source-flow-title source-flow-desc">
<title id="source-flow-title">2. Source information becomes reviewed, connected evidence</title>
<desc id="source-flow-desc">Capturing a reference does not transfer authority · a finding, a decision, and a baseline are separate records</desc>
<defs><marker id="arrow-source-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667683"/></marker></defs>
<rect width="1500" height="1190" fill="white"/>
<text x="35" y="40" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#223746">2. Source information becomes reviewed, connected evidence</text>
<text x="35" y="70" font-family="Arial,sans-serif" font-size="16" fill="#52616b">Capturing a reference does not transfer authority · a finding, a decision, and a baseline are separate records</text>
<polyline points="665,235 665,315" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="665,425 665,510" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="665,620 665,700" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="665,810 665,900" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="370,185 450,185" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="370,370 450,370" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="450,400 410,400 410,555 370,555" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="200,510 200,465 500,465 500,425" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="450,765 370,765" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<polyline points="200,710 200,670 395,670 395,285 600,285 600,315" fill="none" stroke="#667683" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-source-flow)"/>
<polyline points="1000,390 940,390 940,565 880,565" fill="none" stroke="#667683" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-source-flow)"/>
<polyline points="880,955 1000,955" fill="none" stroke="#667683" stroke-width="1.8" marker-end="url(#arrow-source-flow)"/>
<a href="#j01" aria-label="Read J01: Capture an exact source revision">
<rect x="450" y="135" width="430" height="100" rx="5" fill="#f4f4f2" stroke="#71776f"/>
<text x="462" y="160" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Capture an exact source revision</text>
<text x="462" y="187" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">SRC · J01 / J13</text>
<text x="462" y="207" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Origin, revision, locator, captured content</text>
</a>
<a href="#j03" aria-label="Read J03: Interpret, clarify, and draft candidates">
<rect x="450" y="315" width="430" height="110" rx="5" fill="#eff5f9" stroke="#41637c"/>
<text x="462" y="340" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Interpret, clarify, and draft candidates</text>
<text x="462" y="367" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">NEED / SYS / SUB / LINK · J02 / J03</text>
<text x="462" y="387" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Citations, proposed links, unresolved questions</text>
</a>
<a href="#j09" aria-label="Read J09: Independently interrogate the result">
<rect x="450" y="510" width="430" height="110" rx="5" fill="#faf3e6" stroke="#977642"/>
<text x="462" y="535" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Independently interrogate the result</text>
<text x="462" y="562" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">REVIEW · outer loop</text>
<text x="462" y="582" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Check source meaning, coverage, links, and wider</text>
<text x="462" y="602" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">consistency</text>
</a>
<a href="#j10" aria-label="Read J10: Review the named candidate and links">
<rect x="450" y="700" width="430" height="110" rx="5" fill="#faf3e6" stroke="#977642"/>
<text x="462" y="725" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Review the named candidate and links</text>
<text x="462" y="752" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">REVIEW · responsible person</text>
<text x="462" y="772" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Accept, reject, revise, or defer with a reason</text>
</a>
<a href="#j10" aria-label="Read J10: Save accepted records; review the state">
<rect x="450" y="900" width="430" height="110" rx="5" fill="#faf3e6" stroke="#977642"/>
<text x="462" y="925" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Save accepted records; review the state</text>
<text x="462" y="952" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Stable IDs and versions → BASE · J10</text>
<text x="462" y="972" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Individual acceptance and baseline decision stay</text>
<text x="462" y="992" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">distinct</text>
</a>
<a href="#j01" aria-label="Read J01: Original information homes">
<rect x="35" y="135" width="335" height="100" rx="5" fill="#f4f4f2" stroke="#71776f"/>
<text x="47" y="160" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Original information homes</text>
<text x="47" y="187" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Slack / meeting system / documents</text>
<text x="47" y="207" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Authoritative for supplied source content</text>
</a>
<a href="#j02" aria-label="Read J02: Clarify with the responsible person">
<rect x="35" y="315" width="335" height="110" rx="5" fill="#faf3e6" stroke="#977642"/>
<text x="47" y="340" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Clarify with the responsible</text>
<text x="47" y="361" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">person</text>
<text x="47" y="388" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">CLAR · J02</text>
<text x="47" y="408" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Retain the question, answer, and basis</text>
</a>
<a href="#j03" aria-label="Read J03: Inner loop: check and revise">
<rect x="35" y="510" width="335" height="120" rx="5" fill="#eff5f9" stroke="#41637c"/>
<text x="47" y="535" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Inner loop: check and revise</text>
<text x="47" y="562" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Worker / drafting agent</text>
<text x="47" y="582" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Measurability, format, rules, citations</text>
<text x="47" y="602" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Bounded retries; unresolved issues remain</text>
<text x="47" y="622" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">visible</text>
</a>
<a href="#j09" aria-label="Read J09: Return to the author or clarification">
<rect x="35" y="710" width="335" height="130" rx="5" fill="#faf3e6" stroke="#977642"/>
<text x="47" y="735" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Return to the author or</text>
<text x="47" y="756" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">clarification</text>
<text x="47" y="783" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Record rejected / deferred proposals</text>
<text x="47" y="803" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">A revised candidate gets fresh applicable</text>
<text x="47" y="823" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">checks</text>
</a>
<a href="#j09" aria-label="Read J09: Independent access to underlying evidence">
<rect x="1000" y="315" width="445" height="150" rx="5" fill="#f4f4f2" stroke="#71776f"/>
<text x="1012" y="340" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Independent access to underlying evidence</text>
<text x="1012" y="367" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Sources, existing needs and requirements</text>
<text x="1012" y="387" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Risk / usability / model evidence</text>
<text x="1012" y="407" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Design, code/build, tests, and configuration</text>
<text x="1012" y="427" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Selected for the change; omissions are findings</text>
</a>
<rect x="1000" y="700" width="445" height="145" rx="5" fill="#eff5f9" stroke="#41637c"/>
<text x="1012" y="725" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Provisional homes for controlled records</text>
<text x="1012" y="752" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Internal BlueBridge, bought tool, or a hybrid</text>
<text x="1012" y="772" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">Demo candidate: D1 / SQLite structured records</text>
<text x="1012" y="792" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">R2 file bytes and attachments</text>
<text x="1012" y="812" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">One authoritative home per controlled record</text>
<a href="#j12" aria-label="Read J12: Answer questions and produce outputs">
<rect x="1000" y="900" width="445" height="125" rx="5" fill="#faf3e6" stroke="#977642"/>
<text x="1012" y="925" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Answer questions and produce outputs</text>
<text x="1012" y="952" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">DOC · J12 from exact baseline / template</text>
<text x="1012" y="972" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">REL · J11 with build, test, validation, and risk</text>
<text x="1012" y="992" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">evidence</text>
<text x="1012" y="1012" font-family="Arial,sans-serif" font-size="15" fill="#384d5b">A document is an identifiable view of records</text>
</a>
<rect x="556.05" y="254.0" width="217.89999999999998" height="20" fill="white"/>
<text x="665" y="268.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">interpret with source support</text>
<rect x="559.6" y="446.5" width="210.79999999999998" height="20" fill="white"/>
<text x="665" y="460.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">candidate plus check results</text>
<rect x="573.8" y="639.0" width="182.39999999999998" height="20" fill="white"/>
<text x="665" y="653.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">findings for disposition</text>
<rect x="527.65" y="834.0" width="274.7" height="20" fill="white"/>
<text x="665" y="848.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">accepted versions and confirmed links</text>
<rect x="379.15" y="158" width="61.699999999999996" height="20" fill="white"/>
<text x="410" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">capture</text>
<rect x="382.7" y="343" width="54.599999999999994" height="20" fill="white"/>
<text x="410" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">answer</text>
<rect x="386.25" y="466" width="47.5" height="20" fill="white"/>
<text x="410" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">check</text>
<rect x="282.7" y="438" width="54.599999999999994" height="20" fill="white"/>
<text x="310" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">revise</text>
<rect x="382.7" y="739" width="54.599999999999994" height="20" fill="white"/>
<text x="410" y="753" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">return</text>
<rect x="310.9" y="641" width="168.2" height="20" fill="white"/>
<text x="395" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">new candidate revision</text>
<rect x="1067.5" y="486" width="225.0" height="20" fill="white"/>
<text x="1180" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">independently selected context</text>
<rect x="884.3" y="928" width="111.39999999999999" height="20" fill="white"/>
<text x="940" y="942" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#465966">selected state</text>
<text x="35" y="1065" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223746">Authored evidence can enter at candidate creation</text>
<text x="35" y="1091" font-family="Arial,sans-serif" font-size="15" fill="#52616b">Developers can write design notes, requirements, code, and review rationale directly. LLM extraction is optional. Existing controlled evidence supplies context without passing through</text>
<text x="35" y="1111" font-family="Arial,sans-serif" font-size="15" fill="#52616b">transcript ingestion. Both paths need clear ownership, version references, and the applicable reviews.</text>
</svg>